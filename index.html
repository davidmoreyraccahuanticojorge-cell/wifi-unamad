<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío WiFi UNAMAD</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 22px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .question-block {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .question-text {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 8px;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .options label:hover {
            background-color: #e8f4fd;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
        .success {
            color: #27ae60;
        }
        .fail {
            color: #c0392b;
        }
        .password-box {
            font-size: 24px;
            font-weight: bold;
            background: #eee;
            padding: 15px;
            border-radius: 8px;
            letter-spacing: 2px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <h1>Desafío Pre-Uni para WiFi 📚</h1>
    <p class="subtitle">Responde las 5 preguntas correctamente para obtener la contraseña.</p>
    
    <form id="quiz-form">
        <div id="questions-area"></div>
        <button type="submit">Revisar Respuestas</button>
    </form>
</div>

<div class="container" id="result-screen">
    <h1 id="result-title"></h1>
    <p id="result-message"></p>
    <div id="password-display" style="display: none;">
        <p>Tu contraseña es:</p>
        <div class="password-box">Didichee</div>
    </div>
    <button id="retry-btn" onclick="location.reload()" style="display: none;">Sigue intentando 🔄</button>
</div>

<script>
    // Banco de preguntas Pre-Uni UNAMAD Madre de Dios (11 preguntas)
    const bancoPreguntas = [
        {
            pregunta: "Cultura Regional: ¿Cuál es la principal Reserva Nacional ubicada en Madre de Dios, conocida mundialmente por su inmensa biodiversidad?",
            opciones: ["Pacaya Samiria", "Manu", "Tambopata", "Allpahuayo Mishana"],
            respuestaCorrecta: 2
        },
        {
            pregunta: "Historia Local: La capital de la región, Puerto Maldonado, fue fundada en la confluencia de dos importantes ríos. ¿Cuáles son?",
            opciones: ["Madre de Dios y Tambopata", "Manu y Colorado", "Las Piedras y Heath", "Acre y Tahuamanu"],
            respuestaCorrecta: 0
        },
        {
            pregunta: "Razonamiento Matemático: En una serie lógica fundamental para la creación de algoritmos (1, 1, 2, 3, 5, 8, ...), ¿cuál es el siguiente número?",
            opciones: ["11", "12", "13", "15"],
            respuestaCorrecta: 2
        },
        {
            pregunta: "Álgebra: Resolver la siguiente ecuación logarítmica: log₂(x - 1) = 3",
            opciones: ["x = 7", "x = 8", "x = 9", "x = 10"],
            respuestaCorrecta: 2
        },
        {
            pregunta: "Geometría: En un polígono regular, la suma de sus ángulos internos es 1800°. ¿Cuántos lados tiene el polígono?",
            opciones: ["10", "12", "14", "16"],
            respuestaCorrecta: 1
        },
        {
            pregunta: "Física: Determinar el trabajo realizado por una fuerza de 50 N que desplaza un bloque 4 m en su misma dirección.",
            opciones: ["150 J", "200 J", "250 J", "50 J"],
            respuestaCorrecta: 1
        },
        {
            pregunta: "Aritmética: Si A es directamente proporcional a B. Cuando A = 12, B = 4. Hallar A cuando B = 6.",
            opciones: ["18", "16", "24", "14"],
            respuestaCorrecta: 0
        },
        {
            pregunta: "Trigonometría: Reducir la siguiente expresión: M = sen(30°) + cos(60°)",
            opciones: ["0", "1/2", "1", "2"],
            respuestaCorrecta: 2
        },
        {
            pregunta: "Química: ¿Cuál es el hidrocarburo alcano más simple, que además es el principal componente del gas natural?",
            opciones: ["Etano", "Propano", "Butano", "Metano"],
            respuestaCorrecta: 3
        },
        {
            pregunta: "Ecología: ¿Qué ecosistema caracteriza principalmente a la región amazónica de Madre de Dios?",
            opciones: ["Bosque seco ecuatorial", "Bosque de neblina", "Bosque húmedo tropical", "Sabana de palmeras"],
            respuestaCorrecta: 2
        },
        {
            pregunta: "Lenguaje: Marque la oración que presenta un verbo conjugado en tiempo pretérito perfecto simple.",
            opciones: ["El sistema está compilando.", "El postulante ingresó a la universidad.", "Nosotros estudiábamos por las tardes.", "Mañana rendiré la prueba."],
            respuestaCorrecta: 1
        }
    ];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Selecciona 5 preguntas al azar de las 11 disponibles
    const preguntasSeleccionadas = shuffleArray([...bancoPreguntas]).slice(0, 5);

    const questionsArea = document.getElementById('questions-area');
    
    preguntasSeleccionadas.forEach((q, index) => {
        const questionBlock = document.createElement('div');
        questionBlock.className = 'question-block';
        
        let html = `<div class="question-text">${index + 1}. ${q.pregunta}</div><div class="options">`;
        
        q.opciones.forEach((opcion, i) => {
            html += `
                <label>
                    <input type="radio" name="q${index}" value="${i}" required>
                    ${opcion}
                </label>
            `;
        });
        
        html += `</div>`;
        questionBlock.innerHTML = html;
        questionsArea.appendChild(questionBlock);
    });

    document.getElementById('quiz-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let correctas = 0;
        
        preguntasSeleccionadas.forEach((q, index) => {
            const seleccionada = document.querySelector(`input[name="q${index}"]:checked`);
            if (seleccionada && parseInt(seleccionada.value) === q.respuestaCorrecta) {
                correctas++;
            }
        });

        document.getElementById('quiz-container').style.display = 'none';
        const resultScreen = document.getElementById('result-screen');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');
        
        resultScreen.style.display = 'block';

        if (correctas === 5) {
            resultTitle.innerHTML = '<span class="success">¡Excelente! 🎉</span>';
            resultMessage.textContent = 'Respondiste todo bien. Aquí tienes tu recompensa:';
            document.getElementById('password-display').style.display = 'block';
        } else {
            resultTitle.innerHTML = '<span class="fail">Casi... 😅</span>';
            resultMessage.textContent = `Respondiste bien ${correctas} de 5 preguntas. Necesitas puntuación perfecta.`;
            document.getElementById('retry-btn').style.display = 'block';
        }
    });
</script>

</body>
</html>
